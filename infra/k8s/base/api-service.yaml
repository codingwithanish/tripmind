apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  labels:
    app: api-service
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
        component: backend
    spec:
      containers:
        - name: api-service
          image: tripmind/api-service:latest
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tripmind-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tripmind-secrets
                  key: jwt-secret
            - name: JWT_EXPIRE
              valueFrom:
                configMapKeyRef:
                  name: tripmind-config
                  key: jwt-expire
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tripmind-secrets
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tripmind-secrets
                  key: google-client-secret
            - name: GOOGLE_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: tripmind-config
                  key: google-callback-url
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: tripmind-config
                  key: frontend-url
            - name: AI_SERVICE_URL
              value: "http://ai-service:8001"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: api-service
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
