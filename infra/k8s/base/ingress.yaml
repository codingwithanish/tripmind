apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tripmind-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tripmind.com
        - api.tripmind.com
      secretName: tripmind-tls
  rules:
    - host: tripmind.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-ui
                port:
                  number: 80
    - host: api.tripmind.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 3000
