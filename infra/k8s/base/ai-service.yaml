apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  labels:
    app: ai-service
    component: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
        component: ai
    spec:
      containers:
        - name: ai-service
          image: tripmind/ai-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tripmind-secrets
                  key: google-api-key
            - name: DEFAULT_MODEL
              valueFrom:
                configMapKeyRef:
                  name: tripmind-config
                  key: default-ai-model
            - name: AI_EXECUTION_MODE
              valueFrom:
                configMapKeyRef:
                  name: tripmind-config
                  key: ai-execution-mode
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8001"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001
  type: ClusterIP
