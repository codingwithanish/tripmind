version: '3.8'

services:
  web-ui:
    build:
      context: ../../apps/web-ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api-service
    environment:
      - VITE_API_URL=http://api-service:3000
    networks:
      - tripmind-network

  api-service:
    build:
      context: ../../services/api-service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - mongodb
    networks:
      - tripmind-network

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - tripmind-network

